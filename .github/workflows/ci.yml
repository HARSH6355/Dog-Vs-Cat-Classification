# ============================================================
# CI Pipeline — Cat vs Dog MLOps
# ============================================================
# Triggers: every push & pull request to main branch
#
# Jobs:
#   1. test          — Install deps, run all 47 unit tests
#   2. build-and-push — Build Docker image & push to GHCR
#                       (only on push to main, after tests pass)
#
# Image published at:
#   ghcr.io/harsh6355/dog-vs-cat-classification:latest
#   ghcr.io/harsh6355/dog-vs-cat-classification:<sha>
# ============================================================

name: CI — Test, Build & Publish

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ──────────────────────────────────────────────────────────────────────────────
# Job 1: Automated Testing
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python 3.10 (matches training environment)
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Cache pip dependencies to speed up subsequent runs
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install CPU-only PyTorch (no GPU in CI — lightweight & fast)
      - name: Install CPU PyTorch
        run: |
          pip install --upgrade pip
          pip install torch==2.5.1+cpu torchvision==0.20.1+cpu torchaudio==2.5.1+cpu \
            --index-url https://download.pytorch.org/whl/cpu

      # 5. Install remaining project dependencies
      - name: Install project dependencies
        run: |
          # Install without torch lines (already installed above)
          pip install \
            numpy==1.26.4 \
            Pillow==10.3.0 \
            scikit-learn==1.5.0 \
            pandas==2.2.2 \
            mlflow==2.14.1 \
            "setuptools<70" \
            kagglehub==0.3.4 \
            matplotlib==3.9.0 \
            seaborn==0.13.2 \
            PyYAML==6.0.1 \
            pytest==8.2.2 \
            pytest-cov==5.0.0 \
            fastapi==0.111.0 \
            uvicorn==0.30.1 \
            python-multipart==0.0.9 \
            tqdm==4.66.4 \
            requests==2.32.3 \
            "httpx>=0.27.0"

      # 6. Run all unit tests with coverage report
      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing
        env:
          PYTHONPATH: .

      # 7. Upload test results as artifact (optional — good for debugging)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            .coverage
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2: Build Docker Image & Push to GHCR
  # ──────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                    # Only runs if all tests pass
    # Only push on direct pushes to main (not on PRs — security best practice)
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write              # Required to push to GHCR

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (enables advanced build features & caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to GitHub Container Registry
      #    GITHUB_TOKEN is automatically provided — no secrets to configure!
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract metadata for Docker tags and labels
      #    Automatically creates tags: latest, <branch>, <sha>
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      # 5. Build the Docker image and push to GHCR
      #    Uses BuildKit cache to speed up repeated builds
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Print the image digest for traceability
      - name: Image published
        run: |
          echo "✅ Docker image published to GHCR"
          echo "📦 Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "🚀 Pull & run with:"
          echo "  docker pull ghcr.io/${{ github.repository }}:latest"
          echo "  docker run -p 8000:8000 ghcr.io/${{ github.repository }}:latest"
