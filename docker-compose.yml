# ============================================================
# docker-compose.yml — Cat vs Dog Classifier API
# ============================================================
# Two profiles:
#
#   DEV  (builds from local source — for development):
#     docker compose --profile dev up --build
#
#   PROD (pulls from GHCR — mirrors CI/CD deployment):
#     docker compose --profile prod pull
#     docker compose --profile prod up -d
#
# Default (no profile — same as dev, builds locally):
#     docker compose up --build
#
# Stop:
#     docker compose down
# ============================================================

services:

  # ── Development: build from local Dockerfile ─────────────
  cat-dog-api-dev:
    profiles: [ "dev", "default" ]
    build:
      context: .
      dockerfile: Dockerfile
    image: cat-dog-classifier:local
    container_name: cat_dog_classifier_dev
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Production: pull pre-built image from GHCR ───────────
  cat-dog-api-prod:
    profiles: [ "prod" ]
    image: ghcr.io/harsh6355/dog-vs-cat-classification:latest
    container_name: cat_dog_classifier_prod
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
